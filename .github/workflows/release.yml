name: Release Obsidian plugin

# Official flow from https://docs.obsidian.md/Plugins/Releasing/Release+your+plugin+with+GitHub+Actions
# Adapted for this repo's dist/ output: esbuild writes to dist/, so the
# attestation + release steps point at dist/ files instead of the repo root.
# Usage: git tag -a <version> -m <version> && git push origin <version>
# The workflow builds, signs an attestation, and creates a DRAFT release with
# main.js / manifest.json / styles.css attached (publish it manually).

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            dist/main.js dist/manifest.json dist/styles.css
